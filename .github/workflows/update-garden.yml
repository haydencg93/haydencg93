name: Grow the Miso garden

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate profile SVG assets
        run: python scripts/pixel_art.py
      - name: Generate garden from GitHub contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/grow_garden.py
      - name: Refresh README garden URL
        run: python scripts/sync_garden_readme.py
      - name: Commit refreshed art
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          if ! git diff --cached --quiet; then
            git commit -m '🌱 update Miso garden'
            git push
          fi
